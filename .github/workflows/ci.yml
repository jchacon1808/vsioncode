name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # El peso es una característica declarada del proyecto. Si se dispara hay que
  # enterarse en el momento y no tres meses después. No es un techo dogmático
  # (si una mejora legítima lo necesita, se sube a propósito en el mismo
  # cambio): lo que vigila esto es el crecimiento silencioso, no el peso
  # consciente.
  LIMITE_KB: 6000

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formato
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --release

      - name: Tests de documentación
        run: cargo test --release --doc

      # Los dos scripts se ejecutan en la máquina de quien instala, y uno de
      # ellos llega por una tubería desde internet: un fallo ahí no lo atrapa
      # ninguna prueba de Rust.
      #
      # La versión va fijada y no se usa la del runner. `ubuntu-latest` pasó a
      # 24.04, que trae shellcheck 0.9.0, y esa versión **se estrella** —no
      # avisa: revienta con un «Unimplemented: OuterToken»— al leer el
      # `${ builtin history 1; }` de bash 5.3 de `vsion-init.bash:116`. Un
      # `--exclude` no salva de eso, porque no es un aviso que se pueda
      # excluir. Se cayó una compilación que nadie había tocado, así que aquí
      # la herramienta se declara igual que se declara la glibc en
      # `release.yml`: con su versión y su hash.
      - name: Scripts de shell
        env:
          SHELLCHECK: "0.11.0"
          SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          # Fuera del checkout: lo que se descarga no es del proyecto.
          paquete="$RUNNER_TEMP/shellcheck-v${SHELLCHECK}.linux.x86_64.tar.xz"
          curl -fsSL -o "$paquete" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK}/shellcheck-v${SHELLCHECK}.linux.x86_64.tar.xz"
          echo "${SHA256}  ${paquete}" | sha256sum -c -
          tar xf "$paquete" -C "$RUNNER_TEMP"
          sc="$RUNNER_TEMP/shellcheck-v${SHELLCHECK}/shellcheck"
          "$sc" --version

          "$sc" instalar.sh
          # El fichero de arranque elige entre array y cadena según la versión
          # de bash, y al ver las dos ramas shellcheck cree que se mezclan los
          # tipos (SC2128, SC2178). SC2127 era el `${ ...; }` de bash 5.3, que
          # a partir de la 0.10 ya se reconoce; se deja excluido para que bajar
          # de versión no vuelva a romper esto por sorpresa.
          "$sc" --exclude=SC2127,SC2128,SC2178 shell/vsion-init.bash

      - name: Tamaño del binario
        run: |
          cargo build --release
          kb=$(du -k target/release/vsioncode | cut -f1)
          echo "Binario: ${kb} KB (límite ${LIMITE_KB} KB)"
          if [ "$kb" -gt "$LIMITE_KB" ]; then
            echo "::error::El binario ha superado el límite declarado."
            exit 1
          fi

  # Windows todavía no está soportado —ver `docs/RUTA.md` §3.6—, pero el puerto se
  # hace contra este runner y no contra una máquina prestada: las imágenes de
  # GitHub traen Git for Windows, así que aquí dentro hay un bash de verdad
  # bajo ConPTY, que es justo el único riesgo capaz de tumbar el plan.
  #
  # Cada fase del puerto entra con su prueba pasando aquí antes de escribirse
  # la siguiente, y no al revés.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      # El bash de Git for Windows viene en la imagen, pero eso es una promesa
      # de la imagen y no un contrato. Si un día deja de estar, esto lo dice en
      # una línea en vez de dejar veinte pruebas cayéndose sin explicación.
      - name: Está el bash de Git for Windows
        shell: pwsh
        run: |
          $bash = "$env:ProgramFiles\Git\bin\bash.exe"
          if (-not (Test-Path $bash)) {
            Write-Error "no está $bash, y de ahí cuelga todo lo de abajo"
            exit 1
          }
          & $bash --version

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Aquí está lo que de verdad se viene a comprobar: `circuito.rs` arranca
      # ese bash bajo ConPTY y mira si el registro capta comando, salida y
      # código de salida. Es el único riesgo capaz de tumbar el puerto entero,
      # y es la única forma de verlo sin un Windows delante.
      #
      # `--no-fail-fast` a propósito: sin él, un fallo en las pruebas de la
      # biblioteca aborta la tanda y `circuito.rs` no llega a ejecutarse —
      # justo el que responde la única pregunta que importa aquí.
      - name: Tests
        run: cargo test --release --no-fail-fast
