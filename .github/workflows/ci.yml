name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # El peso es una característica declarada del proyecto. Si se dispara hay que
  # enterarse en el momento y no tres meses después. No es un techo dogmático
  # (si una mejora legítima lo necesita, se sube a propósito en el mismo
  # cambio): lo que vigila esto es el crecimiento silencioso, no el peso
  # consciente.
  LIMITE_KB: 6000

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formato
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --release

      - name: Tests de documentación
        run: cargo test --release --doc

      # Los dos scripts se ejecutan en la máquina de quien instala, y uno de
      # ellos llega por una tubería desde internet: un fallo ahí no lo atrapa
      # ninguna prueba de Rust.
      - name: Scripts de shell
        run: |
          shellcheck instalar.sh
          # El fichero de arranque usa `${ ...; }` de bash 5.3, que shellcheck
          # 0.10 todavía no reconoce (SC2127), y elige entre array y cadena
          # según la versión de bash: al ver las dos ramas cree que se mezclan
          # los tipos (SC2128, SC2178). Las tres son falsos positivos aquí.
          shellcheck --exclude=SC2127,SC2128,SC2178 shell/vsion-init.bash

      - name: Tamaño del binario
        run: |
          cargo build --release
          kb=$(du -k target/release/vsioncode | cut -f1)
          echo "Binario: ${kb} KB (límite ${LIMITE_KB} KB)"
          if [ "$kb" -gt "$LIMITE_KB" ]; then
            echo "::error::El binario ha superado el límite declarado."
            exit 1
          fi

  # Windows todavía no está soportado —ver `docs/RUTA.md` §3.6—, pero el puerto se
  # hace contra este runner y no contra una máquina prestada: las imágenes de
  # GitHub traen Git for Windows, así que aquí dentro hay un bash de verdad
  # bajo ConPTY, que es justo el único riesgo capaz de tumbar el plan.
  #
  # Cada fase del puerto entra con su prueba pasando aquí antes de escribirse
  # la siguiente, y no al revés.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      # El bash de Git for Windows viene en la imagen, pero eso es una promesa
      # de la imagen y no un contrato. Si un día deja de estar, esto lo dice en
      # una línea en vez de dejar veinte pruebas cayéndose sin explicación.
      - name: Está el bash de Git for Windows
        shell: pwsh
        run: |
          $bash = "$env:ProgramFiles\Git\bin\bash.exe"
          if (-not (Test-Path $bash)) {
            Write-Error "no está $bash, y de ahí cuelga todo lo de abajo"
            exit 1
          }
          & $bash --version

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Aquí está lo que de verdad se viene a comprobar: `circuito.rs` arranca
      # ese bash bajo ConPTY y mira si el registro capta comando, salida y
      # código de salida. Es el único riesgo capaz de tumbar el puerto entero,
      # y es la única forma de verlo sin un Windows delante.
      - name: Tests
        run: cargo test --release
